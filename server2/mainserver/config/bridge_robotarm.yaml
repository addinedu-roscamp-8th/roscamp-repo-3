# bridge_robotarm.yaml - Main Server Execution
# Structure:
# 1. Command Downstream: Main(59) Separated -> Robot(60/61) Common
# 2. State Upstream: Robot(60/61) Common -> Main(59) Separated

name: robot_shared_bridge
topics:
  # ==========================================
  # [Command] Main(59) -> Robot Arms(60, 61)
  # Main Server sends to specific topics, Robot receives on common topic
  # ==========================================
  
  # Picking Robot (60) Direction
  /picking_command_relay:
    from_domain: 59
    to_domain: 60
    from_topic: /robot1/order_command
    to_topic: /order_command
    type: std_msgs/msg/Float64

  # Packing Robot (61) Direction
  /packing_command_relay:
    from_domain: 59
    to_domain: 61
    from_topic: /robot2/order_command
    to_topic: /order_command
    type: std_msgs/msg/Float64

  # ==========================================
  # [State] Robot Arms(60, 61) -> Main(59)
  # Robot sends on common topic, Main Server receives on specific topics
  # ==========================================

  # Picking Robot (60) State Reporting
  /picking_state_relay:
    from_domain: 60
    to_domain: 59
    from_topic: /robot_state
    to_topic: /robot1/robot_state
    type: std_msgs/msg/Int8

  # Packing Robot (61) State Reporting
  /packing_state_relay:
    from_domain: 61
    to_domain: 59
    from_topic: /robot_state
    to_topic: /robot2/robot_state
    type: std_msgs/msg/Int8
