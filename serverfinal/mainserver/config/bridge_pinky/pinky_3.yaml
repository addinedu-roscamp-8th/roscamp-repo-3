name: pinky_3_bridge
topics:
  #1. 로봇들(1,2,3) -> 관제탑(50,51,52)으로 '요청' 보내기
  /traffic/request:
    type: std_msgs/msg/String
    from_domain: 53
    to_domain: 59
    remap: /pinky3/traffic/request

  /traffic/response:
    type: std_msgs/msg/String
    from_domain: 59
    to_domain: 53
    remap: /pinky3/traffic/response

  /battery/present:
    type: std_msgs/msg/Float32
    from_domain: 53
    to_domain: 59
    remap: /pinky3/battery/present

  /task_zone/arrived:
    type: std_msgs/msg/String     #ex ) PICK_READY ,  PACK_READY
    from_domain: 53
    to_domain: 59
    remap: /pinky3/task_zone/arrived

  /pinky3/arm_working/done:
    type: std_msgs/msg/String
    from_domain: 59
    to_domain: 53
    remap: /arm_working/done     #ex ) PICK_DONE ,  PACK_DONE 
