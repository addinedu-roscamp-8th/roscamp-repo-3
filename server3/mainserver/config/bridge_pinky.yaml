# Pinky Robots Bridge Configuration
# Connects Pinky 1, 2, 3 (Domains 52, 51, 50) to Main Control (Domain 59)

# Pinky 1 (Domain 52 -> 59)
- from_domain: 52
  to_domain: 59
  topics:
    /battery/present:
      type: std_msgs/msg/Float32
      remap: /pinky_1/battery
    /amcl_pose:
      type: geometry_msgs/msg/PoseWithCovarianceStamped
      remap: /pinky_1/pose
      qos:
        durability: transient_local
    /status:
      type: std_msgs/msg/String
      remap: /pinky_1/status

